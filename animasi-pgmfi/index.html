<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animasi PGM-FI</title>
<style>
body{margin:0;background:#eef3f8;font-family:Arial;color:#17233a}.wrap{max-width:1000px;margin:auto;padding:18px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 5px 20px #0001}h1{color:#0b5ed7}
#player{width:100%;min-height:520px;background:#111;border-radius:12px;overflow:hidden}
button{padding:11px 16px;border:0;border-radius:9px;background:#0b5ed7;color:#fff;font-weight:bold;cursor:pointer;margin:5px}
.note{padding:12px;background:#fff5cc;border-left:4px solid #ffc107;border-radius:8px}
</style>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script></head>
<body><div class="wrap"><div class="card">
<h1>🎬 Animasi Sistem PGM-FI</h1>
<p>Animasi Flash lama dari aplikasi PGM-FI dikemas dengan <b>Ruffle</b> agar dapat dicoba pada browser modern.</p>
<div id="player"></div>
<button onclick="loadSWF('pgmfi.swf')">▶ PGM-FI Utama</button>
<button onclick="loadSWF('pgmfi_pendukung.swf')">▶ Animasi Pendukung</button>
<div class="note">Upload folder <b>animasi-pgmfi</b> beserta kedua file SWF. Ruffle dimuat dari internet.</div>
</div></div>
<script>
let player;
window.addEventListener('load',()=>{const r=window.RufflePlayer.newest();player=r.createPlayer();player.style.width='100%';player.style.height='520px';document.getElementById('player').appendChild(player);loadSWF('pgmfi.swf');});
function loadSWF(file){if(player)player.load(file);}
</script></body></html>
